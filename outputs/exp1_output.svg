  <path d="M50 30H850Q868 30 868 48V92H32V48Q32 30 50 30" fill="#2C4034"/>
  <circle cx="62" cy="61" r="6" fill="#D58B79"/><circle cx="83" cy="61" r="6" fill="#D6BE7F"/><circle cx="104" cy="61" r="6" fill="#8FB58D"/>
  <text x="450" y="68" text-anchor="middle" fill="#DAE7DA" font-family="Arial,sans-serif" font-size="18">NutriDay</text>
