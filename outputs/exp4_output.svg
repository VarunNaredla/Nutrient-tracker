<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">NutriDay named route navigation output</title>
  <desc id="desc">The Today page opens Insights, which displays 400 of 2000 calories. The back button returns to Today.</desc>
  <rect width="900" height="650" rx="24" fill="#F7F8F4"/>
  <g font-family="Arial,sans-serif" fill="#25332A">
    <rect x="40" y="38" width="330" height="574" rx="26" fill="white" stroke="#25332A" stroke-width="2"/>
    <path d="M66 38H344Q370 38 370 64V125H40V64Q40 38 66 38" fill="#426B50"/>
    <text x="68" y="93" font-size="28" font-weight="bold" fill="white">Today</text>
    <text x="68" y="177" font-size="20" fill="#667A69">Daily energy</text>
    <rect x="64" y="205" width="282" height="176" rx="19" fill="#EDF3E9"/>
    <text x="88" y="266" font-size="43" font-weight="bold">400</text><text x="88" y="302" font-size="20" fill="#667A69">kcal</text>
    <rect x="88" y="330" width="234" height="10" rx="5" fill="#D9E5D5"/><rect x="88" y="330" width="47" height="10" rx="5" fill="#426B50"/>
    <rect x="64" y="480" width="282" height="57" rx="16" fill="#426B50"/><text x="205" y="516" text-anchor="middle" fill="white" font-size="22" font-weight="bold">View insights</text>
    <path d="M397 285H496M483 272L496 285L483 298" fill="none" stroke="#426B50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M496 410H397M410 397L397 410L410 423" fill="none" stroke="#9BAC98" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="530" y="38" width="330" height="574" rx="26" fill="white" stroke="#25332A" stroke-width="2"/>
    <path d="M556 38H834Q860 38 860 64V125H530V64Q530 38 556 38" fill="#426B50"/>
    <path d="M568 73L555 86L568 99M556 86H579" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <text x="600" y="94" font-size="28" font-weight="bold" fill="white">Insights</text>
    <text x="558" y="177" font-size="20" fill="#667A69">Calories</text>
    <circle cx="695" cy="324" r="99" fill="none" stroke="#E4ECDF" stroke-width="18"/>
    <circle cx="695" cy="324" r="99" fill="none" stroke="#426B50" stroke-width="18" stroke-linecap="round" stroke-dasharray="124 622" transform="rotate(-90 695 324)"/>
    <text x="695" y="320" text-anchor="middle" font-size="44" font-weight="bold">400</text>
    <text x="695" y="354" text-anchor="middle" font-size="18" fill="#667A69">/ 2,000 kcal</text>
    <rect x="554" y="480" width="282" height="57" rx="16" fill="#EDF3E9"/><text x="695" y="516" text-anchor="middle" fill="#426B50" font-size="22">Back to today</text>
  </g>
</svg>
