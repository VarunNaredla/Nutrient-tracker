    <g opacity="0.2" transform="translate(67 267)"><rect width="235" height="200" rx="20" fill="#EDF3E9" stroke="#DCE6D5"/><circle cx="117" cy="48" r="23" fill="#D6E4CB"/><path d="M107 49L115 57L129 41" fill="none" stroke="#426B50" stroke-width="3" stroke-linecap="round"/><text x="117" y="106" text-anchor="middle" font-size="22">Daily energy</text><text x="117" y="157" text-anchor="middle" font-size="37" font-weight="bold">400 <tspan font-size="18" font-weight="normal">kcal</tspan></text></g>
