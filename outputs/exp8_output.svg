  <rect x="28" y="28" width="944" height="554" rx="24" fill="white" stroke="#E8ECE5"/>
  <path d="M52 28H948Q972 28 972 52V118H28V52Q28 28 52 28" fill="#426B50"/>
  <g font-family="Arial,sans-serif" fill="#25332A">
