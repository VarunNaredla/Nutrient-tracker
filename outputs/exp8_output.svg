<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
  <title id="title">NutriDay fade and slide animation output</title>
  <desc id="desc">Three successive positions show the daily energy card becoming opaque and sliding into place, followed by the Replay button.</desc>
