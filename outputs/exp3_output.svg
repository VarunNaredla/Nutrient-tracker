<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">NutriDay responsive output at three widths</title>
  <desc id="desc">The same calorie, protein, carbohydrate and fat cards are shown at 390, 800 and 1200 pixel widths with one, two and four columns.</desc>
  <rect width="1200" height="650" rx="24" fill="#F7F8F4"/>
  <g font-family="Arial,sans-serif" fill="#25332A">
    <text x="145" y="52" text-anchor="middle" font-size="20" fill="#667A69">390 px</text>
    <text x="450" y="52" text-anchor="middle" font-size="20" fill="#667A69">800 px</text>
    <text x="910" y="52" text-anchor="middle" font-size="20" fill="#667A69">1200 px</text>
    <rect x="25" y="80" width="240" height="535" rx="25" fill="white" stroke="#25332A" stroke-width="3"/>
    <rect x="33" y="88" width="224" height="65" rx="18" fill="#426B50"/>
    <text x="53" y="129" fill="white" font-size="25" font-weight="bold">NutriDay</text>
    <g fill="#EDF3E9"><rect x="45" y="176" width="200" height="90" rx="14"/><rect x="45" y="280" width="200" height="90" rx="14"/><rect x="45" y="384" width="200" height="90" rx="14"/><rect x="45" y="488" width="200" height="90" rx="14"/></g>
    <g font-size="18" fill="#667A69"><text x="63" y="206">Calories</text><text x="63" y="310">Protein</text><text x="63" y="414">Carbs</text><text x="63" y="518">Fat</text></g>
    <g font-size="26" font-weight="bold"><text x="63" y="244">400 kcal</text><text x="63" y="348">20.5 g</text><text x="63" y="452">42 g</text><text x="63" y="556">12 g</text></g>
    <rect x="300" y="155" width="300" height="385" rx="20" fill="white" stroke="#25332A" stroke-width="3"/>
    <rect x="308" y="163" width="284" height="65" rx="14" fill="#426B50"/>
    <text x="328" y="204" fill="white" font-size="25" font-weight="bold">NutriDay</text>
    <g fill="#EDF3E9"><rect x="320" y="250" width="120" height="110" rx="12"/><rect x="460" y="250" width="120" height="110" rx="12"/><rect x="320" y="380" width="120" height="110" rx="12"/><rect x="460" y="380" width="120" height="110" rx="12"/></g>
    <g font-size="17" fill="#667A69"><text x="334" y="282">Calories</text><text x="474" y="282">Protein</text><text x="334" y="412">Carbs</text><text x="474" y="412">Fat</text></g>
    <g font-size="25" font-weight="bold"><text x="334" y="321">400</text><text x="474" y="321">20.5 g</text><text x="334" y="451">42 g</text><text x="474" y="451">12 g</text></g><text x="334" y="345" font-size="17">kcal</text>
    <rect x="635" y="225" width="540" height="245" rx="16" fill="white" stroke="#25332A" stroke-width="3"/>
    <rect x="643" y="233" width="524" height="62" rx="10" fill="#426B50"/>
    <text x="661" y="273" fill="white" font-size="25" font-weight="bold">NutriDay</text>
    <g fill="#EDF3E9"><rect x="655" y="318" width="112" height="112" rx="12"/><rect x="783" y="318" width="112" height="112" rx="12"/><rect x="911" y="318" width="112" height="112" rx="12"/><rect x="1039" y="318" width="112" height="112" rx="12"/></g>
    <g font-size="17" fill="#667A69"><text x="667" y="350">Calories</text><text x="795" y="350">Protein</text><text x="923" y="350">Carbs</text><text x="1051" y="350">Fat</text></g>
    <g font-size="24" font-weight="bold"><text x="667" y="389">400</text><text x="795" y="389">20.5 g</text><text x="923" y="389">42 g</text><text x="1051" y="389">12 g</text></g><text x="667" y="414" font-size="17">kcal</text>
  </g>
</svg>
